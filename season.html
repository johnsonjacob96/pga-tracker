<script>
const EVENT_KEYS = ["Masters", "PGA Championship", "US Open", "Open Championship"];
const SHORT_EVENT = { "Masters": "Masters", "PGA Championship": "PGA", "US Open": "U.S. Open", "Open Championship": "The Open" };

const normalize = (s) =>
  s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ø/g, "o").replace(/Ø/g, "O").replace(/[.\s'-]/g, "").toLowerCase();

const fmtScore = (n) => {
  if (n === null || n === undefined || isNaN(n)) return "—";
  if (n === 0) return "E";
  return (n > 0 ? `+${n}` : `${n}`).replace("-", "−");
};

const scoreClass = (n) => {
  if (n === null || n === undefined || isNaN(n)) return "";
  if (n < 0) return "s-under";
  if (n === 0) return "s-even";
  return "s-over";
};

function parseScore(raw) {
  if (raw == null) return null;
  if (typeof raw === "number") return raw;
  const s = String(raw).trim();
  if (s === "" || s === "—") return null;
  if (s === "E") return 0;
  if (s.startsWith("+")) return parseInt(s.slice(1), 10);
  return parseInt(s, 10);
}

function applyTeamScoring(eventEntry, players, completed, winner) {
  // Cut survival: if any player has played 3+ rounds the cut is enforced;
  // anyone with fewer than 3 rounds AND no MC flag is treated as still in
  // the field. USGA explicitly marks "MC" — we honor it when present.
  const cutEnforced = Object.values(players).some(p => p.roundsPlayed >= 3);
  for (const p of Object.values(players)) {
    if (p.madeCut === undefined) {
      p.madeCut = !cutEnforced || !p.missedCutFlag;
    }
  }
  const made = Object.values(players).filter(p => p.madeCut && p.score !== null).map(p => p.score);
  const penalty = (made.length ? Math.max(...made) : 0) + 2;
  const winnerNorm = winner ? normalize(winner) : null;
  const teamScores = {};
  for (const [teamName, roster] of Object.entries(eventEntry.roster || {})) {
    const ps = roster.map(rn => players[normalize(rn)] || { score: null, madeCut: false });
    const sorted = ps.filter(p => p.madeCut && p.score !== null).sort((a, b) => a.score - b.score);
    let total = 0;
    for (let i = 0; i < Math.min(3, sorted.length); i++) total += sorted[i].score;
    total += Math.max(0, 3 - sorted.length) * penalty;
    if (winnerNorm && roster.some(rn => normalize(rn) === winnerNorm)) total -= 3;
    teamScores[teamName] = total;
  }
  return teamScores;
}

async function fetchUSGAEvent(eventEntry) {
  // Only the Cloudflare deployment has the worker; on GitHub Pages this 404s
  // and we silently fall through to ESPN.
  const year = new Date(eventEntry.startDate + "T12:00:00").getUTCFullYear();
  const res = await fetch(`/api/usopen-scoreboard?year=${year}`);
  if (!res.ok) return null;
  const wrapper = await res.json();
  if (!wrapper?.payload) return null;
  const data = wrapper.payload;
  const standings = data.standings || [];
  if (!standings.length) return null;
  const players = {};
  for (const s of standings) {
    const name = ((s.player?.firstName || "") + " " + (s.player?.lastName || "")).trim();
    if (!name) continue;
    const mc = (s.position?.displayValue || "").toUpperCase() === "MC";
    players[normalize(name)] = {
      name,
      score: typeof s.toPar?.value === "number" ? s.toPar.value : null,
      roundsPlayed: (s.roundScores || []).length,
      missedCutFlag: mc,
    };
  }
  // Missed-cut players have no holesThrough field, so filter to the active
  // field before requiring every player to be marked "F". Otherwise the
  // tournament would never flip to Final.
  const activeField = standings.filter(s => s.holesThrough?.displayValue);
  const completed = data.round >= 4 && activeField.length > 0 && activeField.every(s => /^F/i.test(s.holesThrough.displayValue));
  let winner = null;
  if (completed) {
    const top = standings.find(s => s.position?.value === 1);
    if (top) winner = ((top.player.firstName || "") + " " + (top.player.lastName || "")).trim();
  }
  const teamScores = applyTeamScoring(eventEntry, players, completed, winner);
  return {
    status: completed ? "Final" : `Round ${data.round} · In Progress`,
    complete: completed,
    winner,
    teamScores,
  };
}

async function fetchESPNEvent(eventEntry) {
  const res = await fetch("https://site.api.espn.com/apis/site/v2/sports/golf/pga/scoreboard");
  if (!res.ok) throw new Error(`ESPN ${res.status}`);
  const data = await res.json();
  const eventKey = s => s.toLowerCase().replace(/[^a-z0-9]/g, "");
  const want = eventKey(eventEntry.name);
  const event = (data.events || []).find(e => e.name && eventKey(e.name).includes(want));
  if (!event) return null;
  const competition = event.competitions?.[0];
  if (!competition) return null;
  const players = {};
  for (const comp of competition.competitors || []) {
    const name = comp.athlete?.fullName || comp.athlete?.displayName;
    if (!name) continue;
    players[normalize(name)] = {
      name,
      score: parseScore(comp.score),
      roundsPlayed: (comp.linescores || []).length,
    };
  }
  const completed = event.status?.type?.completed === true;
  let winner = null;
  if (completed) {
    const finishers = (competition.competitors || [])
      .filter(c => (c.linescores || []).length === 4)
      .map(c => ({ name: c.athlete?.fullName || c.athlete?.displayName, score: parseScore(c.score) }))
      .filter(c => c.name && c.score !== null)
      .sort((a, b) => a.score - b.score);
    if (finishers.length) winner = finishers[0].name;
  }
  const teamScores = applyTeamScoring(eventEntry, players, completed, winner);
  return {
    status: event.status?.type?.description || "In Progress",
    complete: completed,
    winner,
    teamScores,
  };
}

async function fetchLiveEvent(eventEntry) {
  // U.S. Open prefers USGA (via our Cloudflare proxy) when available because
  // ESPN's leaderboard updates lag. Every other major rides ESPN directly.
  if (eventEntry.name === "US Open") {
    try {
      const usga = await fetchUSGAEvent(eventEntry);
      if (usga) return usga;
    } catch (e) {
      console.warn("USGA proxy failed, falling back to ESPN:", e);
    }
  }
  try {
    return await fetchESPNEvent(eventEntry);
  } catch (e) {
    console.error(`Live fetch failed for ${eventEntry.name}:`, e);
    return null;
  }
}

function findLiveEvents(seasonData) {
  // Any event with a roster drafted but not yet marked complete is "live" —
  // either ongoing or just-ended-no-snapshot-baked. ESPN/USGA report Final
  // state automatically once the tournament is over.
  return (seasonData.events || []).filter(e => e.roster && !e.complete);
}

async function loadSeason() {
  const res = await fetch("./data/2026-season.json?v=" + Date.now());
  if (!res.ok) throw new Error("Could not load season data");
  return res.json();
}

function teamScoreForOwner(seasonData, eventName, owner) {
  const event = seasonData.events.find(e => e.name === eventName);
  if (!event || !event.teams) return null;
  const team = event.teams.find(t => t.owner === owner);
  return team ? team.score : null;
}

function computeCumulative(seasonData, liveMap) {
  const owners = Object.entries(seasonData.owners).map(([owner, teamName]) => {
    const scores = {};
    for (const evKey of EVENT_KEYS) {
      const live = liveMap[evKey];
      if (live) {
        scores[evKey] = live.teamScores[teamName] ?? null;
      } else {
        scores[evKey] = teamScoreForOwner(seasonData, evKey, owner);
      }
    }
    const total = Object.values(scores).reduce((sum, s) => sum + (s ?? 0), 0);
    return { owner, teamName, scores, total };
  });
  owners.sort((a, b) => a.total - b.total);
  return owners;
}

function renderCumulative(rows, liveMap) {
  const heads = EVENT_KEYS.map(e => `<th>${SHORT_EVENT[e]}</th>`).join("");
  const body = rows.map((r, i) => {
    const scoreCells = EVENT_KEYS.map(e => {
      const s = r.scores[e];
      if (s === null || s === undefined) return '<td class="score-cell pending">—</td>';
      const live = liveMap[e] && !liveMap[e].complete;
      return `<td class="score-cell ${scoreClass(s)}${live ? " live" : ""}">${fmtScore(s)}</td>`;
    }).join("");
    return `
      <tr${i === 0 ? ' class="leader"' : ""}>
        <td class="rank-cell">${String(i + 1).padStart(2, "0")}</td>
        <td class="name-cell">
          <span class="name">${r.teamName}</span>
          <span class="name-owner">${r.owner}</span>
        </td>
        ${scoreCells}
        <td class="total-cell ${scoreClass(r.total)}">${fmtScore(r.total)}</td>
      </tr>
    `;
  }).join("");
  return `
    <div class="cum">
      <table>
        <thead><tr><th>#</th><th class="left">Team</th>${heads}<th>Total</th></tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>
  `;
}

function renderEvent(event, liveMap, ownerMap) {
  const live = liveMap[event.name];
  if (!event.complete && !live) {
    return `
      <article class="event upcoming">
        <div class="event-header">
          <h3 class="event-name">${event.name === "Open Championship" ? "The Open" : event.name}</h3>
          <div class="event-tag">${event.month}</div>
        </div>
        <div class="upcoming-msg">Not yet played — picks pending</div>
      </article>
    `;
  }
  let teams = [];
  let isLive = false, isFinal = false, winnerLine = "";
  if (live) {
    isLive = !live.complete;
    isFinal = live.complete;
    teams = Object.entries(live.teamScores)
      .map(([teamName, score]) => {
        const owner = Object.entries(ownerMap).find(([o, t]) => t === teamName)?.[0] || "?";
        return { owner, teamName, score };
      })
      .sort((a, b) => a.score - b.score);
    if (live.complete && live.winner) {
      const winnerNorm = normalize(live.winner);
      const winningTeam = Object.entries(event.roster || {}).find(([_, roster]) => roster.some(rn => normalize(rn) === winnerNorm));
      const pickedBy = winningTeam ? `picked by ${Object.entries(ownerMap).find(([_, t]) => t === winningTeam[0])?.[0] || winningTeam[0]}` : "not on any roster";
      winnerLine = `Winner — ${live.winner} <em>(${pickedBy})</em>`;
    }
  } else {
    isFinal = true;
    teams = (event.teams || []).slice().sort((a, b) => a.score - b.score);
    if (event.winner) {
      const pickedBy = event.winnerPickedBy
        ? `picked by ${event.winnerPickedBy}`
        : "not on any roster";
      winnerLine = `Winner — ${event.winner} <em>(${pickedBy})</em>`;
    }
  }

  const rows = teams.map((t, i) => `
    <div class="et${i === 0 ? " winner" : ""}">
      <span class="et-name">${t.teamName} <em>${t.owner}</em></span>
      <span class="et-score ${scoreClass(t.score)}">${fmtScore(t.score)}</span>
    </div>
  `).join("");

  const rosters = event.teams ? event.teams.slice().sort((a, b) => a.score - b.score).map(t => `
    <div class="event-roster"><strong>${t.teamName}</strong> — ${t.players.join(", ")} <em style="color:var(--persimmon);">(${fmtScore(t.score)})</em></div>
  `).join("") : "";

  const tag = isLive
    ? `<div class="event-tag live">● Live</div>`
    : (isFinal ? `<div class="event-tag final">Final</div>` : `<div class="event-tag">${event.month}</div>`);

  const rosterToggle = event.teams && event.teams.length
    ? `<button class="event-roster-toggle" onclick="this.closest('.event').classList.toggle('show-rosters'); this.textContent = this.closest('.event').classList.contains('show-rosters') ? 'Hide rosters' : 'Show rosters';">Show rosters</button>`
    : (isLive ? `<a href="./" style="color:var(--persimmon);font-family:'Fraunces',serif;font-style:italic;font-size:11px;text-decoration:none;display:inline-block;margin-top:8px;">→ Live scorecards</a>` : "");

  return `
    <article class="event">
      <div class="event-header">
        <div>
          <h3 class="event-name">${event.name === "Open Championship" ? "The Open" : event.name}</h3>
          ${winnerLine ? `<div style="font-family:'Spectral',serif;font-style:italic;font-size:12px;color:var(--ink-mute);margin-top:2px;">${winnerLine}</div>` : ""}
        </div>
        ${tag}
      </div>
      <div class="event-teams">${rows}</div>
      ${rosterToggle}
      <div class="event-rosters">${rosters}</div>
    </article>
  `;
}

function findNextUpcoming(seasonData, today = new Date()) {
  return (seasonData.events || []).find(e => {
    if (!e.startDate || e.complete) return false;
    return new Date(e.startDate + "T00:00:00") > today;
  });
}

async function render() {
  const status = document.getElementById("status");
  const content = document.getElementById("content");
  try {
    const seasonData = await loadSeason();
    const liveEvents = findLiveEvents(seasonData);
    const liveMap = {};
    if (liveEvents.length) {
      status.textContent = `Pulling live scores for ${liveEvents.map(e => e.name).join(", ")}…`;
      const results = await Promise.all(liveEvents.map(e => fetchLiveEvent(e)));
      liveEvents.forEach((e, i) => { if (results[i]) liveMap[e.name] = results[i]; });
    }
    const cumulative = computeCumulative(seasonData, liveMap);
    const cumHtml = renderCumulative(cumulative, liveMap);
    const eventsHtml = seasonData.events.map(e => renderEvent(e, liveMap, seasonData.owners)).join("");
    content.innerHTML = `
      <div class="section-label">Cumulative Standings <em>lowest wins</em></div>
      ${cumHtml}
      <div class="section-label">The Four Majors</div>
      ${eventsHtml}
    `;
    const now = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    const liveNames = Object.keys(liveMap);
    let statusBit;
    if (liveNames.length) {
      statusBit = liveNames.map(n => `${n === "Open Championship" ? "The Open" : n} · ${liveMap[n].status}`).join(" · ");
    } else {
      const next = findNextUpcoming(seasonData);
      statusBit = next ? `Next: ${next.name === "Open Championship" ? "The Open" : next.name} · ${next.month}` : "All majors complete";
    }
    status.textContent = `${statusBit} · Updated ${now}`;
  } catch (e) {
    status.textContent = `Error: ${e.message}`;
    console.error(e);
  }
}

// Poll every 60s while any major is live (or just-ended-no-snapshot); otherwise static.
let seasonPollTimer = null;
async function bootstrap() {
  await render();
  try {
    const s = await loadSeason();
    if (findLiveEvents(s).length && !seasonPollTimer) {
      seasonPollTimer = setInterval(render, 60000);
    }
  } catch (_) { /* ignore */ }
}
bootstrap();
</script>
